services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal_finance_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance_user}:${POSTGRES_PASSWORD:-finance_pass}@postgres:5432/${POSTGRES_DB:-personal_finance}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - '8080:3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: personal_finance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_pass}
      POSTGRES_DB: ${POSTGRES_DB:-personal_finance}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-finance_user} -d ${POSTGRES_DB:-personal_finance}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
